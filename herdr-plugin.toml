id = "ronalson.copy-env"
name = "Copy Env"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Set up new Herdr worktrees: copy .env files and folders, pick a port, start the dev server in a tab"
platforms = ["linux", "macos"]

[[events]]
on = "worktree.created"
command = ["python3", "copy_env.py"]

[[actions]]
id = "copy"
title = "Set up this worktree (copy files, start server)"
contexts = ["workspace"]
command = ["python3", "copy_env.py"]
